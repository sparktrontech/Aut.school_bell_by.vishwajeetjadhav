<!DOCTYPE html>
<html>
<head>
<title>Automatic School Bell</title>
<style>
body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
}

.container{
width:90%;
margin:auto;
margin-top:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, select{
padding:8px;
margin:5px;
width:150px;
}

button{
padding:8px 15px;
background:#3498db;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#2980b9;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<header>
<h2>Automatic School Bell System</h2>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input type="text" id="username" placeholder="Username"><br>
<input type="password" id="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="card hidden" id="dashboard">

<h3>Set Bell Schedule (24-Hour Format)</h3>

<select id="day">
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
</select>

<input type="number" id="hour" placeholder="Hour (0-23)" min="0" max="23">
<input type="number" id="minute" placeholder="Minute (0-59)" min="0" max="59">
<input type="number" id="duration" placeholder="Duration (sec)">
<button onclick="addSchedule()">Add</button>

<h3>Time Table</h3>
<table border="1" width="100%" id="table">
<tr>
<th>Day</th>
<th>Time</th>
<th>Duration</th>
</tr>
</table>

</div>

</div>

<script>

function login(){
let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

if(user==="admin" && pass==="12345"){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
}
else{
alert("Wrong Username or Password");
}
}

function addSchedule(){
let day=document.getElementById("day").value;
let hour=document.getElementById("hour").value;
let minute=document.getElementById("minute").value;
let duration=document.getElementById("duration").value;

if(hour==="" || minute==="" || duration===""){
alert("Fill all fields");
return;
}

let table=document.getElementById("table");
let row=table.insertRow(-1);

row.insertCell(0).innerHTML=day;
row.insertCell(1).innerHTML=hour.padStart(2,'0')+":"+minute.padStart(2,'0');
row.insertCell(2).innerHTML=duration+" sec";

}

</script>

</body>
</html>
